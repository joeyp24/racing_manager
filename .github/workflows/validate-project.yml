name: Validate project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source and repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate project structure
        run: python tools/validate_project.py

      - name: Run source contract tests
        run: python -m pytest -q tests

      - name: Simulate long careers
        if: always()
        run: >-
          python tools/career_simulation.py
          --difficulty Club
          --careers 64
          --seasons 20
          --seed 2026
          --fail-on-threshold
          --json artifacts/career-simulation.json
          --csv artifacts/career-simulation.csv

      - name: Upload career simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-simulation-report
          path: artifacts/career-simulation.*
          if-no-files-found: error

  godot:
    name: Godot headless validation
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Godot
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Parse project and run behavioral tests
        run: python tools/run_godot_checks.py
